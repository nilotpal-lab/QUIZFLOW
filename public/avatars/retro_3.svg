<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0d3d3d"/>
  <!-- ninja -->
  <rect x="68" y="108" width="64" height="60" rx="4" fill="#111111" shape-rendering="crispEdges"/>
  <!-- belt -->
  <rect x="68" y="130" width="64" height="8" fill="#7B2FBE" shape-rendering="crispEdges"/>
  <rect x="96" y="126" width="8" height="16" fill="#9B4FDE" shape-rendering="crispEdges"/>
  <!-- face wrap -->
  <rect x="72" y="60" width="56" height="52" rx="8" fill="#111111" shape-rendering="crispEdges"/>
  <!-- eyes only visible part -->
  <rect x="78" y="76" width="18" height="10" fill="#1a1a2e" shape-rendering="crispEdges"/>
  <rect x="104" y="76" width="18" height="10" fill="#1a1a2e" shape-rendering="crispEdges"/>
  <!-- eyes glow -->
  <rect x="80" y="78" width="14" height="6" fill="#7B2FBE" shape-rendering="crispEdges"/>
  <rect x="106" y="78" width="14" height="6" fill="#7B2FBE" shape-rendering="crispEdges"/>
  <!-- headband -->
  <rect x="68" y="62" width="64" height="10" fill="#7B2FBE" shape-rendering="crispEdges"/>
  <!-- throwing stars -->
  <polygon points="165,75 170,60 175,75 188,70 175,80 170,95 165,80 152,70" fill="#C0C0C0" opacity="0.9"/>
  <polygon points="30,120 35,105 40,120 53,115 40,125 35,140 30,125 17,115" fill="#C0C0C0" opacity="0.7"/>
  <!-- hair strands -->
  <rect x="68" y="58" width="10" height="20" rx="5" fill="#111111" shape-rendering="crispEdges"/>
  <rect x="122" y="58" width="10" height="20" rx="5" fill="#111111" shape-rendering="crispEdges"/>
</svg>
